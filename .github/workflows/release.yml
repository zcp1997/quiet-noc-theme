name: build theme archive

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate theme files
        run: |
          python3 -m json.tool theme.json >/dev/null
          test -s dist/index.html
          test -s preview.png

      # The archive extracts directly into <themes-dir>/<short>/, matching the
      # on-disk layout expected by monitor hub.
      - name: Build theme archive
        run: |
          tar czf theme.tar.gz dist theme.json preview.png
          sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-noc-theme-${{ github.sha }}
          path: |
            theme.tar.gz
            theme.tar.gz.sha256

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
